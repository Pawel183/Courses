<div class="container-sm">
  <h1>Your cart</h1>

  <mat-card>
    <mat-list>
      @for (item of cartItems; track item.id) {
        <mat-list-item>
          <span matListItemTitle>{{ item.name }}</span>
          <span class="price" matListItemLine>{{ item.price | currency: 'USD' }}</span>
        </mat-list-item>
      }

      <mat-list-item>
        <span matListItemTitle>Total Price</span>
        <span class="price" matListItemLine>{{ totalPrice | currency: 'USD' }}</span>
      </mat-list-item>

      <mat-list-item class="text-right">
        <button mat-flat-button (click)="clearCart()">Clear</button>
      </mat-list-item>

      <mat-list-item class="text-right">
        <button mat-raised-button color="accent">Checkout</button>
      </mat-list-item>
    </mat-list>
  </mat-card>
</div>
