<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Email Subscribe</title>
  </head>
  <body>
    <div class="flex bg-zinc-700 h-screen items-center justify-center">
      <div class="bg-zinc-800 rounded-2xl p-2 mx-6">
        <div class="flex flex-col md:flex-row rounded-l-xl">
          <img
            class="object-fit rounded-xl h-80 md:h-64 rounded-r-none hover:scale-105 duration-200"
            src="images/image.jpg"
            alt=""
          />
          <div class="p-6 md:p-12">
            <h2
              class="text-white font-serif text-xl text-center md:text-left font-medium"
            >
              Get diet and fitness tips in your inbox
            </h2>
            <p
              class="text-white text-xs leading-5 tracking-wide my-4 max-w-xs text-center md:text-left"
            >
              Eat better and exercise better. Sign up for the Diet&Fitness
              newsletter.
            </p>
            <div
              class="flex flex-col mt-5 space-y-4 md:flex-row md:space-x-3 md:space-y-0"
            >
              <input
                type="text"
                placeholder="Enter your email address"
                class="bg-zinc-800 border-zinc-600 text-left text-white border p-2 px-4 font-small focus:outline-none"
              />
              <button
                class="bg-lime-500 px-5 py-3 rounded-lg text-zinc-800 text-xs hover:text-white hover:bg-lime-700 duration-500"
              >
                Subscribe
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
